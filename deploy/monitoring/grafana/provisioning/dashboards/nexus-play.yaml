apiVersion: 1

providers:
  - name: nexus-play
    orgId: 1
    folder: Nexus Play
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      # Install the dashboard JSON in this Grafana-readable directory.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
