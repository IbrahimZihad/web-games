receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT:-127.0.0.1:4318}
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_OTLP_GRPC_ENDPOINT:-127.0.0.1:4317}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_COLLECTOR_MEMORY_LIMIT_MIB:-512}
    spike_limit_mib: ${env:OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB:-128}
  batch:
    timeout: 5s
    send_batch_size: ${env:OTEL_COLLECTOR_BATCH_SIZE:-1024}
    send_batch_max_size: 2048

connectors:
  spanmetrics:
    namespace: nexus_play
    metrics_flush_interval: 15s
    histogram:
      explicit:
        buckets:
          - 5ms
          - 10ms
          - 25ms
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2s
          - 5s
          - 10s
          - 30s
    dimensions:
      - name: service.name
      - name: http.method
      - name: http.route
      - name: http.status_code

exporters:
  prometheus:
    endpoint: ${env:OTEL_COLLECTOR_PROMETHEUS_ENDPOINT:-127.0.0.1:9464}
    enable_open_metrics: true
    const_labels:
      environment: ${env:SENTRY_ENVIRONMENT:-development}
  debug:
    verbosity: ${env:OTEL_COLLECTOR_DEBUG_VERBOSITY:-basic}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, spanmetrics]
    metrics:
      receivers: [spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
