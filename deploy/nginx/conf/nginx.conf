worker_processes auto;
worker_rlimit_nofile 65535;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
  worker_connections 20000;
  multi_accept on;
}

http {
  include mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  client_max_body_size 251m;
  client_body_buffer_size 256k;
  client_body_temp_path .runtime/nginx/client_body;
  proxy_temp_path .runtime/nginx/proxy;
  fastcgi_temp_path .runtime/nginx/fastcgi;
  uwsgi_temp_path .runtime/nginx/uwsgi;
  scgi_temp_path .runtime/nginx/scgi;
  proxy_buffering off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 2;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/graphql-response+json image/svg+xml;

  log_format portal '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status '
                    'upstream=$upstream_addr conn=$connection';
  access_log logs/access.log portal;

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=1000r/s;
  limit_req_zone $binary_remote_addr zone=static_per_ip:10m rate=10000r/s;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

  map "$request_method|$http_cookie|$http_authorization|$http_rsc|$http_next_router_state_tree|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_purpose|$http_cache_control|$http_pragma|$args" $skip_html_cache {
    default 1;
    "GET||||||||||" 0;
    "HEAD||||||||||" 0;
  }

  proxy_cache_path .runtime/nginx/cache levels=1:2 keys_zone=html_cache:20m max_size=512m inactive=10m;

  upstream next_app {
    server 127.0.0.1:3000;
    keepalive 256;
  }

  server {
    listen 8080 backlog=10000;
    server_name _;

    location ^~ /_next/static/ {
      alias .next/static/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include security-headers.conf;
      access_log off;
      limit_req zone=static_per_ip burst=20000 nodelay;
      limit_conn connections_per_ip 12000;
    }

    location ^~ /uploads/games/ {
      root public;
      try_files $uri =404;
      expires 1h;
      include security-headers.conf;
      add_header Cross-Origin-Opener-Policy "same-origin";
      add_header Cross-Origin-Embedder-Policy "require-corp";
      add_header Cross-Origin-Resource-Policy "same-origin";
      access_log off;
      limit_req zone=static_per_ip burst=20000 nodelay;
      limit_conn connections_per_ip 12000;
    }

    location ~* \.(?:css|js|mjs|json|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|mp4|webm|wasm|map)$ {
      root public;
      try_files $uri @next_proxy;
      expires 7d;
      include security-headers.conf;
      access_log off;
      limit_req zone=static_per_ip burst=20000 nodelay;
      limit_conn connections_per_ip 12000;
    }

    location /api/graphql {
      include proxy-common.conf;
      include security-headers.conf;
      proxy_cache off;
      limit_req zone=api_per_ip burst=2000 nodelay;
      limit_conn connections_per_ip 12000;
      proxy_pass http://next_app;
    }

    location /api/upload/ {
      include proxy-common.conf;
      include security-headers.conf;
      proxy_cache off;
      proxy_request_buffering on;
      proxy_read_timeout 300s;
      limit_req zone=api_per_ip burst=100 nodelay;
      limit_conn connections_per_ip 100;
      proxy_pass http://next_app;
    }

    location ^~ /admin {
      include proxy-common.conf;
      include security-headers.conf;
      proxy_cache off;
      limit_req zone=api_per_ip burst=2000 nodelay;
      proxy_pass http://next_app;
    }

    location / {
      include proxy-common.conf;
      include security-headers.conf;
      add_header X-Cache $upstream_cache_status always;
      proxy_cache html_cache;
      proxy_cache_key "$scheme$host$request_method$uri";
      proxy_cache_valid 200 5s;
      proxy_cache_valid 404 1s;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;
      proxy_cache_lock_age 10s;
      proxy_cache_background_update on;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_ignore_headers Cache-Control Expires;
      proxy_buffering on;
      proxy_no_cache $skip_html_cache;
      proxy_cache_bypass $skip_html_cache;
      limit_req zone=api_per_ip burst=2000 nodelay;
      limit_conn connections_per_ip 12000;
      proxy_pass http://next_app;
    }

    location @next_proxy {
      include proxy-common.conf;
      include security-headers.conf;
      proxy_cache off;
      limit_req zone=static_per_ip burst=20000 nodelay;
      proxy_pass http://next_app;
    }
  }
}
