    <radialGradient id="pinkNebula" cx="50%" cy="50%" r="50%"><stop stop-color="#ff3aa8" stop-opacity=".32"/><stop offset="1" stop-color="#ff3aa8" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyanNebula" cx="50%" cy="50%" r="50%"><stop stop-color="#20e9ef" stop-opacity=".25"/><stop offset="1" stop-color="#20e9ef" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx="32%" cy="25%" r="78%"><stop stop-color="#c18aff"/><stop offset=".38" stop-color="#663aa2"/><stop offset=".78" stop-color="#24164e"/><stop offset="1" stop-color="#090d25"/></radialGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaffff"/><stop offset=".32" stop-color="#54f3ef"/><stop offset=".72" stop-color="#147eaa"/><stop offset="1" stop-color="#092c58"/></linearGradient>
