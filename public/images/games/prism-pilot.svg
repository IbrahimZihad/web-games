    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#040510" stop-opacity=".98"/><stop offset=".48" stop-color="#040510" stop-opacity=".66"/><stop offset="1" stop-color="#040510" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
