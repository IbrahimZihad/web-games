<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hoop Rush</title>
  <desc id="desc">An original rooftop basketball cover with a stylized player, a flying orange ball, a neon hoop and a glowing city court.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070617"/>
      <stop offset="0.55" stop-color="#251044"/>
      <stop offset="1" stop-color="#0b2634"/>
    </linearGradient>
    <radialGradient id="sunset" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff713d" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#ff713d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1cf4ed" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#1cf4ed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17213b"/>
      <stop offset="1" stop-color="#080e20"/>
    </linearGradient>
    <linearGradient id="jersey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbf54"/>
      <stop offset="0.5" stop-color="#ff7935"/>
      <stop offset="1" stop-color="#dc3c55"/>
    </linearGradient>
    <radialGradient id="ball" cx="32%" cy="24%" r="80%">
      <stop offset="0" stop-color="#ffc15c"/>
      <stop offset="0.5" stop-color="#f47a28"/>
      <stop offset="1" stop-color="#a92f35"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070617" stop-opacity="0.96"/>
      <stop offset="0.54" stop-color="#070617" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#070617" stop-opacity="0"/>
    </linearGradient>
    <pattern id="net" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0L12 12M12 0L0 12" fill="none" stroke="#d9fbff" stroke-opacity="0.65" stroke-width="1"/>
    </pattern>
    <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#fff" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="ballClip"><circle cx="0" cy="0" r="49"/></clipPath>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
