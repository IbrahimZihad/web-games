    <text x="72" y="218" fill="#f8f7ff" font-size="88" font-weight="900" letter-spacing="-5">STAR</text>
    <text x="72" y="310" fill="#20f4ee" font-size="88" font-weight="900" letter-spacing="-5" filter="url(#glow)">SIEGE</text>
    <path d="M76 340H364" stroke="#ff7c3c" stroke-width="5"/>
    <text x="76" y="382" fill="#c8c4dc" font-size="18" font-weight="600" letter-spacing="1">ONE PILOT. AN ENTIRE FLEET.</text>
    <g transform="translate(76 424)">
      <rect width="142" height="42" rx="8" fill="#20f4ee" fill-opacity="0.1" stroke="#20f4ee" stroke-opacity="0.5"/>
      <text x="18" y="27" fill="#d9feff" font-size="13" font-weight="700" letter-spacing="2">WAVE COMBAT</text>
      <rect x="156" width="164" height="42" rx="8" fill="#ff7c3c" fill-opacity="0.1" stroke="#ff7c3c" stroke-opacity="0.5"/>
      <text x="174" y="27" fill="#ffe3d1" font-size="13" font-weight="700" letter-spacing="2">BOSS SIEGE</text>
    </g>
    <text x="76" y="638" fill="#817a9f" font-size="12" font-weight="700" letter-spacing="4">ORIGINAL ARCADE SERIES // 04</text>
    <g transform="translate(1080 624)">
      <text x="0" y="0" fill="#cdb9ee" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3">SECTOR</text>
      <text x="0" y="48" fill="#f8f7ff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900">07 // ORION</text>
    </g>
