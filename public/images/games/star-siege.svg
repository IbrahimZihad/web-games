<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Star Siege</title>
  <desc id="desc">An original deep-space shooter cover with a cyan starfighter, orange plasma fire, alien drones and a vast violet planet.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050514"/>
      <stop offset="0.5" stop-color="#170b31"/>
      <stop offset="1" stop-color="#041a2a"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a239ff" stop-opacity="0.5"/>
      <stop offset="0.48" stop-color="#5f2b9c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5f2b9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0adce9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0adce9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#b37cff"/>
      <stop offset="0.38" stop-color="#5a35a0"/>
      <stop offset="0.75" stop-color="#201b50"/>
      <stop offset="1" stop-color="#090d25"/>
    </radialGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5ffff"/>
      <stop offset="0.35" stop-color="#36edf0"/>
      <stop offset="0.72" stop-color="#167fa9"/>
      <stop offset="1" stop-color="#092c58"/>
    </linearGradient>
    <linearGradient id="enemy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb1e1"/>
      <stop offset="0.5" stop-color="#dd3d9d"/>
      <stop offset="1" stop-color="#652071"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7b0"/><stop offset="0.35" stop-color="#ff9f32"/><stop offset="1" stop-color="#ff3b65" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050514" stop-opacity="0.97"/><stop offset="0.52" stop-color="#050514" stop-opacity="0.56"/><stop offset="1" stop-color="#050514" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#space)"/>
  <ellipse cx="905" cy="290" rx="540" ry="410" fill="url(#nebula)"/>
  <ellipse cx="530" cy="520" rx="470" ry="260" fill="url(#blueNebula)"/>

  <g fill="#d8f8ff">
    <circle cx="88" cy="82" r="1.6"/><circle cx="186" cy="174" r="1"/><circle cx="278" cy="70" r="2"/>
    <circle cx="370" cy="238" r="1.4"/><circle cx="470" cy="106" r="1.2"/><circle cx="574" cy="48" r="1.8"/>
    <circle cx="672" cy="174" r="1"/><circle cx="770" cy="76" r="2"/><circle cx="866" cy="214" r="1.3"/>
    <circle cx="954" cy="56" r="1.5"/><circle cx="1060" cy="250" r="1"/><circle cx="1170" cy="104" r="2"/>
    <circle cx="1240" cy="300" r="1.2"/><circle cx="1010" cy="432" r="1.6"/><circle cx="1138" cy="520" r="1.3"/>
