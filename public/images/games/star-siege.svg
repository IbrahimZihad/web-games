  <g fill="none" stroke="#20f4ee" stroke-opacity="0.24" stroke-width="2">
    <circle cx="540" cy="462" r="136" stroke-dasharray="5 13"/>
    <path d="M390 462H422M658 462H690M540 310V334M540 590V616"/>
  </g>

  <g transform="translate(955 548)" opacity="0.8">
    <path d="M0 0H186M0 10H128M0 20H154" stroke="#a75cff" stroke-width="3"/>
    <text x="0" y="52" fill="#cdb9ee" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3">THREAT LEVEL 09</text>
  </g>

  <rect width="1280" height="720" fill="url(#shade)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(76 66)">
      <rect width="222" height="30" rx="15" fill="#17122e" stroke="#a75cff" stroke-opacity="0.55"/>
      <circle cx="17" cy="15" r="4" fill="#a75cff" filter="url(#glow)"/>
      <text x="32" y="20" fill="#ead9ff" font-size="12" font-weight="700" letter-spacing="3">DEEP SPACE DEFENSE</text>
