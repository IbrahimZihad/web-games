    <ellipse rx="166" ry="25" fill="none" stroke="#ff73bf" stroke-opacity="0.2" stroke-width="2" transform="rotate(-18)"/>
  </g>

  <g transform="translate(812 224)" filter="url(#glow)">
    <path d="M0-38L24-10L76 10L48 18L24 46L12 18L-32 26L-20 6L-58-16L-16-12Z" fill="url(#enemy)" stroke="#ffb2df" stroke-width="3"/>
    <path d="M-18 4H28L12 19H-7Z" fill="#271038"/>
    <circle cx="4" cy="5" r="7" fill="#ff7c5c"/>
    <circle cx="4" cy="5" r="3" fill="#fff2c2"/>
  </g>
  <g transform="translate(1010 328) scale(0.78)" filter="url(#glow)">
    <path d="M0-38L24-10L76 10L48 18L24 46L12 18L-32 26L-20 6L-58-16L-16-12Z" fill="url(#enemy)" stroke="#ffb2df" stroke-width="3"/>
    <path d="M-18 4H28L12 19H-7Z" fill="#271038"/>
    <circle cx="4" cy="5" r="7" fill="#ff7c5c"/>
  </g>
  <g transform="translate(736 372) scale(0.58)" filter="url(#glow)">
    <path d="M0-38L24-10L76 10L48 18L24 46L12 18L-32 26L-20 6L-58-16L-16-12Z" fill="url(#enemy)" stroke="#ffb2df" stroke-width="3"/>
    <circle cx="4" cy="5" r="7" fill="#ff7c5c"/>
  </g>

  <g fill="#ff4fa6" opacity="0.8" filter="url(#glow)">
    <path d="M850 265L873 276L850 287L838 276Z"/>
    <path d="M974 352L989 360L974 368L966 360Z"/>
    <path d="M779 379L791 385L779 392L773 385Z"/>
  </g>

  <g filter="url(#glow)">
    <path d="M576 405L715 248" stroke="#ff633c" stroke-width="22" stroke-linecap="round" opacity="0.2" filter="url(#blur)"/>
    <path d="M576 405L715 248" stroke="url(#beam)" stroke-width="9" stroke-linecap="round"/>
    <path d="M556 426L686 286" stroke="#ffb23d" stroke-width="4" stroke-linecap="round"/>
    <path d="M595 390L724 242" stroke="#fff7c2" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(540 462)" filter="url(#glow)">
    <ellipse cy="72" rx="92" ry="25" fill="#16e9ee" opacity="0.17" filter="url(#blur)"/>
    <path d="M0-94L28-28L92 58L31 42L0 88L-31 42L-92 58L-28-28Z" fill="url(#ship)" stroke="#baffff" stroke-width="4"/>
    <path d="M0-78L13-18L0 34L-13-18Z" fill="#0a355d" stroke="#64f6fa" stroke-width="2"/>
    <path d="M-27-20L-72 48L-30 36L0 66L30 36L72 48L27-20Z" fill="#11577e" opacity="0.82"/>
    <path d="M-22 55L0 104L22 55" fill="#ff8c32" stroke="#fff0a0" stroke-width="3"/>
    <path d="M-13 60L0 91L13 60" fill="#e9ffff"/>
    <path d="M-82 51L-46 37M82 51L46 37" stroke="#20f4ee" stroke-width="6"/>
    <circle cy="-8" r="11" fill="#9dffff" stroke="#eaffff" stroke-width="3"/>
