    <circle r="112" fill="url(#planet)" stroke="#a77aff" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M-103-36C-45-62 28-58 91-20M-110 12C-38-7 35-2 100 26M-89 61C-24 46 41 53 82 73" fill="none" stroke="#c19aff" stroke-opacity="0.16" stroke-width="9"/>
    <path d="M-93-55A111 111 0 0 1 30-107" fill="none" stroke="#e0c8ff" stroke-opacity="0.55" stroke-width="4"/>
