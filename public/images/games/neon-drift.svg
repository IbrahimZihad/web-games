<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Neon Drift</title>
  <desc id="desc">An original top-down night racing cover featuring a cyan and orange sports car, electric light trails and a futuristic elevated circuit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070615"/>
      <stop offset="0.55" stop-color="#17102f"/>
      <stop offset="1" stop-color="#061a27"/>
    </linearGradient>
    <radialGradient id="pink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b638ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#b638ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#16f1ef" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#16f1ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1b33"/>
      <stop offset="0.6" stop-color="#0a0d1b"/>
      <stop offset="1" stop-color="#151027"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79ffff"/>
      <stop offset="0.32" stop-color="#18cdd9"/>
      <stop offset="0.7" stop-color="#126b92"/>
      <stop offset="1" stop-color="#092e53"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9fbff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#21466c"/>
      <stop offset="1" stop-color="#090d24"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a1"/>
      <stop offset="0.45" stop-color="#ff9e32"/>
      <stop offset="1" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070615" stop-opacity="0.98"/>
      <stop offset="0.5" stop-color="#070615" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#070615" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 11H12" stroke="#fff" stroke-opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="1010" cy="260" rx="440" ry="360" fill="url(#pink)"/>
  <ellipse cx="790" cy="560" rx="420" ry="260" fill="url(#cyan)"/>

  <g opacity="0.55" fill="#0b0b20" stroke="#35244f" stroke-width="2">
    <path d="M0 80H150V20H260V130H360V62H470V180H580V96H690V156H800V44H910V138H1020V76H1130V148H1280V300H0Z"/>
    <path d="M0 300H180V220H300V286H430V190H550V278H690V214H820V292H960V206H1080V274H1200V214H1280V370H0Z"/>
  </g>
  <g stroke="#26f4ee" stroke-width="2" opacity="0.5" filter="url(#glow)">
    <path d="M150 20V0H260M800 44V0H910M430 190V140H550M960 206V154H1080"/>
  </g>
  <g fill="#ff42b0" opacity="0.6" filter="url(#glow)">
