  <path d="M690-80L1210-80L1005 800L415 800Z" fill="url(#asphalt)" stroke="#3a3158" stroke-width="4"/>
  <path d="M690-80L725-80L462 800H415Z" fill="#0a0b1b"/>
  <path d="M1175-80L1210-80L1005 800H958Z" fill="#0a0b1b"/>

  <g fill="none" stroke-linecap="round">
    <path d="M702-80L442 800" stroke="#20f4ee" stroke-width="8" filter="url(#glow)"/>
    <path d="M1198-80L977 800" stroke="#ff4a9f" stroke-width="8" filter="url(#glow)"/>
    <path d="M788-80L571 800M886-80L708 800M984-80L845 800" stroke="#e8e5ff" stroke-opacity="0.45" stroke-width="5" stroke-dasharray="42 46"/>
    <path d="M753-80L506 800M1125-80L900 800" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  </g>

  <g opacity="0.75" filter="url(#glow)">
    <path d="M742 20C772 182 662 377 562 640" fill="none" stroke="#16f1ef" stroke-width="14" stroke-linecap="round"/>
    <path d="M742 20C772 182 662 377 562 640" fill="none" stroke="#d8ffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M1110 16C1092 176 1016 370 932 646" fill="none" stroke="#ff6a2c" stroke-width="13" stroke-linecap="round"/>
    <path d="M1110 16C1092 176 1016 370 932 646" fill="none" stroke="#fff0a3" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g fill="#ff43ae" filter="url(#glow)">
    <path d="M673 54L689 54L676 128L658 128Z"/>
    <path d="M1164 282L1180 282L1160 356L1142 356Z"/>
  </g>

  <g transform="translate(820 390) rotate(18)" filter="url(#glow)">
    <ellipse cx="8" cy="24" rx="105" ry="194" fill="#00040e" opacity="0.7" filter="url(#blur)"/>
    <g fill="#050817" stroke="#2bd7df" stroke-width="3">
      <rect x="-91" y="-116" width="31" height="78" rx="11"/>
      <rect x="60" y="-116" width="31" height="78" rx="11"/>
      <rect x="-91" y="58" width="31" height="82" rx="11"/>
      <rect x="60" y="58" width="31" height="82" rx="11"/>
    </g>
    <path d="M-72-166L-48-194H48L72-166L91-74L76 112L52 178H-52L-76 112L-91-74Z" fill="url(#carBody)" stroke="#a9ffff" stroke-width="4"/>
    <path d="M-55-158L-35-184H35L55-158L41-92H-41Z" fill="#0a1730" stroke="#53e8ef" stroke-width="3"/>
    <path d="M-38-172H38L31-139H-31Z" fill="#ff8a32" opacity="0.82"/>
    <path d="M-50-76L50-76L65 32L-65 32Z" fill="url(#glass)" stroke="#64f5f4" stroke-width="3"/>
    <path d="M-40-63L40-63L48-10H-48Z" fill="#173553" opacity="0.75"/>
    <path d="M-64 45H64L74 112H-74Z" fill="#0c4868" stroke="#36dce4" stroke-width="3"/>
    <path d="M-52 126H52L43 166H-43Z" fill="#09283e" stroke="#36dce4" stroke-width="3"/>
    <path d="M-76 98L-51 94M51 94L76 98" stroke="#ff6a2c" stroke-width="8"/>
    <path d="M-67-88L-42-86M42-86L67-88" stroke="#eaffff" stroke-width="9" filter="url(#glow)"/>
    <path d="M-62 142L-39 137M39 137L62 142" stroke="#ff3b58" stroke-width="8" filter="url(#glow)"/>
    <path d="M0-78V170" stroke="#b9ffff" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M-82-34L-58-20L-57 54L-81 68M82-34L58-20L57 54L81 68" fill="none" stroke="#ff8738" stroke-width="7"/>
    <rect x="-75" y="-4" width="150" height="9" rx="4" fill="#07111f" opacity="0.65"/>
  </g>

  <g fill="#fff" opacity="0.75">
    <circle cx="770" cy="174" r="2"/><circle cx="1090" cy="342" r="2"/><circle cx="694" cy="432" r="1.5"/>
    <circle cx="1018" cy="114" r="1.5"/><circle cx="862" cy="618" r="2"/><circle cx="1140" cy="536" r="1.5"/>
  </g>
  <rect width="1280" height="720" fill="url(#grain)"/>
  <rect width="1280" height="720" fill="url(#shade)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(76 66)">
      <rect width="224" height="30" rx="15" fill="#17132d" stroke="#b95cff" stroke-opacity="0.55"/>
      <circle cx="17" cy="15" r="4" fill="#b95cff" filter="url(#glow)"/>
      <text x="32" y="20" fill="#ead9ff" font-size="12" font-weight="700" letter-spacing="3">MIDNIGHT CIRCUIT</text>
    </g>
    <text x="72" y="218" fill="#f8f7ff" font-size="90" font-weight="900" letter-spacing="-5">NEON</text>
    <text x="72" y="310" fill="#ff9138" font-size="90" font-weight="900" letter-spacing="-5" filter="url(#glow)">DRIFT</text>
    <path d="M76 340H382" stroke="#20f4ee" stroke-width="5"/>
    <text x="76" y="382" fill="#c8c4dc" font-size="18" font-weight="600" letter-spacing="1">NO BRAKES. NO LIMITS.</text>
    <g transform="translate(76 424)">
      <rect width="144" height="42" rx="8" fill="#20f4ee" fill-opacity="0.1" stroke="#20f4ee" stroke-opacity="0.5"/>
      <text x="18" y="27" fill="#d9feff" font-size="13" font-weight="700" letter-spacing="2">4 LANES</text>
      <rect x="158" width="154" height="42" rx="8" fill="#ff783f" fill-opacity="0.1" stroke="#ff783f" stroke-opacity="0.5"/>
      <text x="176" y="27" fill="#ffe1cf" font-size="13" font-weight="700" letter-spacing="2">NITRO READY</text>
    </g>
    <text x="76" y="638" fill="#817a9f" font-size="12" font-weight="700" letter-spacing="4">ORIGINAL ARCADE SERIES // 02</text>
    <g transform="translate(1010 596)" opacity="0.9">
      <text x="0" y="0" fill="#a9f8ff" font-size="11" font-weight="700" letter-spacing="3">VELOCITY</text>
      <text x="0" y="62" fill="#f8f7ff" font-size="48" font-weight="900">286</text>
      <text x="120" y="60" fill="#ff9138" font-size="13" font-weight="700">KM/H</text>
      <path d="M0 78H196" stroke="#20f4ee" stroke-width="3"/>
      <path d="M0 78H142" stroke="#ff9138" stroke-width="3"/>
    </g>
