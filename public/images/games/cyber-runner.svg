<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Runner</title>
  <desc id="desc">An original neon cyberpunk runner cover with a futuristic city, a cyan and orange athlete, drones and energy coins.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060512"/>
      <stop offset="0.52" stop-color="#160a31"/>
      <stop offset="1" stop-color="#071c2c"/>
    </linearGradient>
    <radialGradient id="magentaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3ea5" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#ff3ea5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#20f4ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#20f4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15132c"/>
      <stop offset="1" stop-color="#050713"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#d92d73"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4a3"/>
      <stop offset="0.45" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#ff6a2a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060512" stop-opacity="0.96"/>
      <stop offset="0.56" stop-color="#060512" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#060512" stop-opacity="0"/>
    </linearGradient>
    <pattern id="windows" width="30" height="34" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="7" height="4" rx="1" fill="#27e9f5" opacity="0.55"/>
      <rect x="19" y="19" width="5" height="4" rx="1" fill="#ff4ca8" opacity="0.46"/>
    </pattern>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#b8f9ff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="roadClip">
      <path d="M420 276H1040L1240 720H230Z"/>
    </clipPath>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="1040" cy="240" rx="430" ry="350" fill="url(#magentaGlow)"/>
  <ellipse cx="690" cy="510" rx="410" ry="250" fill="url(#cyanGlow)"/>

  <g opacity="0.7">
    <circle cx="1090" cy="116" r="58" fill="#191332" stroke="#5a3b88" stroke-width="2"/>
    <circle cx="1073" cy="99" r="9" fill="#34224e"/>
    <circle cx="1112" cy="136" r="15" fill="#2b1d45"/>
    <path d="M1018 118A72 72 0 0 1 1152 80" fill="none" stroke="#28e8f4" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <g fill="#0b0a1d" stroke="#32204f" stroke-width="2">
    <path d="M0 180H96V122H168V220H240V74H328V194H410V146H486V252H552V184H632V238H710V102H790V212H878V152H950V230H1034V88H1112V212H1184V154H1280V370H0Z"/>
  </g>
