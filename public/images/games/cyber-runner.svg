    <path d="M-28 3L0-7L34 3L0 15Z" fill="#ff4aa7" opacity="0.75"/>
    <circle cx="0" cy="2" r="6" fill="#fff"/>
    <path d="M-45 0L-67-8M48 0L68-10" stroke="#25eaf4" stroke-width="4"/>
  </g>

  <g transform="translate(665 270)" filter="url(#glow)">
    <circle cx="66" cy="22" r="29" fill="#101326" stroke="#263b58" stroke-width="3"/>
    <path d="M45 15L89 10L94 27L52 34Z" fill="#20f4ff"/>
    <path d="M80 15L96 19" stroke="#d8ffff" stroke-width="4"/>
