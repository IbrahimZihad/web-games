    <path d="M168 220H240"/><path d="M552 184H632"/><path d="M950 230H1034"/>
  </g>

  <path d="M420 276H1040L1240 720H230Z" fill="url(#road)"/>
  <g clip-path="url(#roadClip)">
    <path d="M520 276L410 720M660 276L625 720M800 276L855 720M940 276L1085 720" stroke="#26ecf6" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M480 350H1000M435 440H1060M370 555H1130M270 690H1210" stroke="#7542a7" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M590 276L570 720M730 276L730 720M870 276L895 720" stroke="#f8f4ff" stroke-opacity="0.2" stroke-width="5" stroke-dasharray="28 35"/>
    <path d="M420 276L230 720M1040 276L1240 720" stroke="#ff3da5" stroke-width="8" filter="url(#glow)"/>
    <path d="M438 276L266 720M1022 276L1188 720" stroke="#26ecf6" stroke-width="3" filter="url(#glow)"/>
    <ellipse cx="755" cy="606" rx="170" ry="38" fill="#20f4ff" opacity="0.13" filter="url(#soft)"/>
  </g>

  <g opacity="0.88" filter="url(#glow)">
    <path d="M526 375C526 351 545 332 569 332C593 332 612 351 612 375C612 399 593 418 569 418C545 418 526 399 526 375Z" fill="url(#coin)" stroke="#fff0a0" stroke-width="3"/>
    <path d="M569 345L582 375L569 405L556 375Z" fill="#a84a16" opacity="0.65"/>
    <path d="M673 319C673 300 688 285 707 285C726 285 741 300 741 319C741 338 726 353 707 353C688 353 673 338 673 319Z" fill="url(#coin)" stroke="#fff0a0" stroke-width="3"/>
