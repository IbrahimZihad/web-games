    <path d="M80 53L126 77L162 47" fill="none" stroke="#ff773c" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160 47L177 36" stroke="#20f4ff" stroke-width="13" stroke-linecap="round"/>
    <path d="M39 70L6 108L-25 96" fill="none" stroke="#d94273" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-25 96L-45 86" stroke="#20f4ff" stroke-width="12" stroke-linecap="round"/>
    <path d="M65 139L38 207L76 246" fill="none" stroke="#151a31" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M65 139L38 207L76 246" fill="none" stroke="#ff6b35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 132L128 185L99 244" fill="none" stroke="#11172b" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 132L128 185L99 244" fill="none" stroke="#20f4ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M68 245L99 238L112 255L75 266L50 258Z" fill="#20f4ff"/>
    <path d="M91 242L122 244L137 260L98 265L79 255Z" fill="#ff8a3d"/>
    <path d="M23 102L-8 124" stroke="#20f4ff" stroke-width="4" opacity="0.8"/>
  </g>

  <g stroke="#20f4ff" stroke-linecap="round" filter="url(#glow)">
    <path d="M512 481H616" stroke-width="4" opacity="0.75"/>
    <path d="M476 510H592" stroke-width="2" opacity="0.5"/>
    <path d="M844 404H948" stroke-width="3" opacity="0.55"/>
    <path d="M810 437H906" stroke-width="2" opacity="0.35"/>
  </g>

  <rect width="1280" height="720" fill="url(#scan)"/>
  <rect width="1280" height="720" fill="url(#fade)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(76 68)">
      <rect width="238" height="30" rx="15" fill="#15142b" stroke="#28e8f4" stroke-opacity="0.45"/>
      <circle cx="17" cy="15" r="4" fill="#20f4ff" filter="url(#glow)"/>
      <text x="32" y="20" fill="#a9f8ff" font-size="12" font-weight="700" letter-spacing="3">NIGHT CITY // 2099</text>
    </g>
    <text x="72" y="202" fill="#f8f7ff" font-size="88" font-weight="900" letter-spacing="-5">CYBER</text>
    <text x="72" y="292" fill="#20f4ff" font-size="88" font-weight="900" letter-spacing="-5" filter="url(#glow)">RUNNER</text>
    <path d="M76 322H344" stroke="#ff783f" stroke-width="5"/>
    <text x="76" y="362" fill="#c5c2dc" font-size="18" font-weight="600" letter-spacing="1">OUTRUN THE GRID. OWN THE NIGHT.</text>
    <g transform="translate(76 408)">
      <rect width="156" height="42" rx="8" fill="#20f4ff" fill-opacity="0.1" stroke="#20f4ff" stroke-opacity="0.55"/>
      <text x="18" y="27" fill="#d9feff" font-size="13" font-weight="700" letter-spacing="2">ENDLESS MODE</text>
      <rect x="170" width="132" height="42" rx="8" fill="#ff6b35" fill-opacity="0.1" stroke="#ff6b35" stroke-opacity="0.55"/>
      <text x="188" y="27" fill="#ffe1cf" font-size="13" font-weight="700" letter-spacing="2">3 LANES</text>
    </g>
    <text x="76" y="638" fill="#817a9f" font-size="12" font-weight="700" letter-spacing="4">ORIGINAL ARCADE SERIES // 01</text>
    <g transform="translate(1080 620)" opacity="0.8">
      <path d="M0 0H110M0 8H76M0 16H92" stroke="#20f4ff" stroke-width="3"/>
      <text x="0" y="48" fill="#a9f8ff" font-size="12" font-weight="700" letter-spacing="2">SYNC 100%</text>
    </g>
