<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Blockfall</title>
  <desc id="desc">An original neon falling-block puzzle cover with a glowing matrix, colorful geometric pieces and an explosive orange line clear.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080615"/>
      <stop offset="0.55" stop-color="#1a0c35"/>
      <stop offset="1" stop-color="#071b2c"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9d39ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9d39ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aqua" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#16f2e5" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#16f2e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16142d" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#070b19" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="cyanBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bffff"/><stop offset="0.45" stop-color="#20e6e8"/><stop offset="1" stop-color="#1184b7"/>
    </linearGradient>
    <linearGradient id="purpleBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a3ff"/><stop offset="0.45" stop-color="#a64cff"/><stop offset="1" stop-color="#5923a7"/>
    </linearGradient>
    <linearGradient id="orangeBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a0"/><stop offset="0.45" stop-color="#ff9b32"/><stop offset="1" stop-color="#e34544"/>
    </linearGradient>
    <linearGradient id="pinkBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb0dc"/><stop offset="0.45" stop-color="#ff4aa8"/><stop offset="1" stop-color="#a51f70"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080615" stop-opacity="0.98"/><stop offset="0.52" stop-color="#080615" stop-opacity="0.55"/><stop offset="1" stop-color="#080615" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="38" height="42" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V42" fill="none" stroke="#6a4b94" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
    <pattern id="micro" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b8a8dc" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <g id="cubeCyan">
      <polygon points="0,0 32,-18 64,0 32,18" fill="#8dffff"/>
      <polygon points="0,0 32,18 32,50 0,32" fill="#159ebc"/>
      <polygon points="32,18 64,0 64,32 32,50" fill="#086486"/>
      <path d="M3 2L32-14L61 2" fill="none" stroke="#eaffff" stroke-width="2" opacity="0.8"/>
    </g>
    <g id="cubePurple">
      <polygon points="0,0 32,-18 64,0 32,18" fill="#dba4ff"/>
      <polygon points="0,0 32,18 32,50 0,32" fill="#8736d2"/>
      <polygon points="32,18 64,0 64,32 32,50" fill="#482080"/>
      <path d="M3 2L32-14L61 2" fill="none" stroke="#f6ddff" stroke-width="2" opacity="0.8"/>
    </g>
    <g id="cubeOrange">
      <polygon points="0,0 32,-18 64,0 32,18" fill="#ffe487"/>
      <polygon points="0,0 32,18 32,50 0,32" fill="#ef7829"/>
      <polygon points="32,18 64,0 64,32 32,50" fill="#a93438"/>
      <path d="M3 2L32-14L61 2" fill="none" stroke="#fff5c7" stroke-width="2" opacity="0.8"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="905" cy="270" rx="420" ry="380" fill="url(#violet)"/>
  <ellipse cx="890" cy="600" rx="430" ry="220" fill="url(#aqua)"/>
  <rect width="1280" height="720" fill="url(#micro)"/>

  <g opacity="0.3" stroke="#8155bd" fill="none">
    <path d="M0 100H1280M0 220H1280M0 340H1280M0 460H1280M0 580H1280M0 700H1280"/>
    <path d="M100 0V720M260 0V720M420 0V720M580 0V720M740 0V720M900 0V720M1060 0V720M1220 0V720"/>
  </g>
  <g fill="#0b0a1d" stroke="#372453" stroke-width="2" opacity="0.75">
    <path d="M0 620H70V540H140V596H210V486H280V572H350V520H420V640H0Z"/>
    <path d="M940 640H1010V558H1080V612H1150V506H1220V574H1280V720H940Z"/>
  </g>

  <g transform="translate(690 92)">
