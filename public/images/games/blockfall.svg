    <rect y="378" width="366" height="42" fill="#ff7b32" opacity="0.2"/>
    <path d="M0 399H366" stroke="#ff9d32" stroke-width="4" filter="url(#glow)"/>
    <g stroke="#fff4ba" stroke-width="3" opacity="0.9">
      <path d="M-8 380L-24 372M-8 418L-26 430M374 380L390 368M374 418L394 432"/>
    </g>

    <g transform="translate(132 160) rotate(-8 64 25)" filter="url(#glow)">
      <use href="#cubeCyan" x="0" y="0"/><use href="#cubeCyan" x="64" y="0"/><use href="#cubeCyan" x="64" y="36"/><use href="#cubeCyan" x="128" y="36"/>
    </g>
    <g transform="translate(236 280) rotate(7 32 25)" filter="url(#glow)">
      <use href="#cubeOrange" x="0" y="0"/><use href="#cubeOrange" x="64" y="0"/><use href="#cubeOrange" x="0" y="36"/>
    </g>
    <path d="M110 310L132 320M250 250L234 264M190 346L190 368" stroke="#d9c6ff" stroke-width="2" stroke-dasharray="5 7" opacity="0.5"/>
  </g>

  <g transform="translate(1100 126)" opacity="0.9">
    <rect width="104" height="104" rx="14" fill="#0c0b20" stroke="#694794" stroke-width="2"/>
    <text x="16" y="26" fill="#a796c4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2">NEXT</text>
    <g transform="translate(23 49)" filter="url(#glow)"><use href="#cubePurple" x="0" y="0"/><use href="#cubePurple" x="32" y="18"/></g>
  </g>

  <rect width="1280" height="720" fill="url(#shade)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(76 66)">
      <rect width="210" height="30" rx="15" fill="#18122e" stroke="#a75cff" stroke-opacity="0.55"/>
      <circle cx="17" cy="15" r="4" fill="#a75cff" filter="url(#glow)"/>
      <text x="32" y="20" fill="#ead9ff" font-size="12" font-weight="700" letter-spacing="3">PUZZLE PROTOCOL</text>
    </g>
    <text x="72" y="218" fill="#f8f7ff" font-size="90" font-weight="900" letter-spacing="-5">BLOCK</text>
    <text x="72" y="310" fill="#20e6e8" font-size="90" font-weight="900" letter-spacing="-5" filter="url(#glow)">FALL</text>
    <path d="M76 340H342" stroke="#ff9138" stroke-width="5"/>
    <text x="76" y="382" fill="#c8c4dc" font-size="18" font-weight="600" letter-spacing="1">STACK SMART. CLEAR THE SIGNAL.</text>
    <g transform="translate(76 424)">
      <rect width="148" height="42" rx="8" fill="#20e6e8" fill-opacity="0.1" stroke="#20e6e8" stroke-opacity="0.5"/>
      <text x="18" y="27" fill="#d9feff" font-size="13" font-weight="700" letter-spacing="2">7 SHAPES</text>
      <rect x="162" width="166" height="42" rx="8" fill="#ff9138" fill-opacity="0.1" stroke="#ff9138" stroke-opacity="0.5"/>
      <text x="180" y="27" fill="#ffe7cf" font-size="13" font-weight="700" letter-spacing="2">CHAIN CLEARS</text>
    </g>
    <text x="76" y="638" fill="#817a9f" font-size="12" font-weight="700" letter-spacing="4">ORIGINAL ARCADE SERIES // 03</text>
    <g transform="translate(1080 606)">
      <text x="0" y="0" fill="#a796c4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3">COMBO</text>
      <text x="0" y="58" fill="#ffad45" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">x8</text>
      <path d="M0 76H126" stroke="#a75cff" stroke-width="3"/>
    </g>
