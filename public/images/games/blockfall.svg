        <rect x="76" width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
        <rect x="152" width="34" height="38" rx="5" fill="url(#pinkBlock)" stroke="#ffc4e7"/>
        <rect x="190" width="34" height="38" rx="5" fill="url(#pinkBlock)" stroke="#ffc4e7"/>
        <rect x="228" width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
        <rect x="266" width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
      </g>
      <g transform="translate(0 420)">
        <rect width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
        <rect x="38" width="34" height="38" rx="5" fill="url(#purpleBlock)" stroke="#e4b7ff"/>
        <rect x="76" width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
        <rect x="114" width="34" height="38" rx="5" fill="url(#orangeBlock)" stroke="#fff0ae"/>
        <rect x="152" width="34" height="38" rx="5" fill="url(#pinkBlock)" stroke="#ffc4e7"/>
        <rect x="228" width="34" height="38" rx="5" fill="url(#purpleBlock)" stroke="#e4b7ff"/>
        <rect x="304" width="34" height="38" rx="5" fill="url(#orangeBlock)" stroke="#fff0ae"/>
      </g>
      <g transform="translate(76 462)">
        <rect width="34" height="38" rx="5" fill="url(#purpleBlock)" stroke="#e4b7ff"/>
        <rect x="38" width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
        <rect x="76" width="34" height="38" rx="5" fill="url(#orangeBlock)" stroke="#fff0ae"/>
        <rect x="152" width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
        <rect x="190" width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
        <rect x="228" width="34" height="38" rx="5" fill="url(#pinkBlock)" stroke="#ffc4e7"/>
        <rect x="266" width="34" height="38" rx="5" fill="url(#purpleBlock)" stroke="#e4b7ff"/>
        <rect x="304" width="34" height="38" rx="5" fill="url(#purpleBlock)" stroke="#e4b7ff"/>
      </g>
      <g transform="translate(114 504)">
        <rect width="34" height="38" rx="5" fill="url(#orangeBlock)" stroke="#fff0ae"/>
        <rect x="38" width="34" height="38" rx="5" fill="url(#orangeBlock)" stroke="#fff0ae"/>
        <rect x="76" width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
        <rect x="152" width="34" height="38" rx="5" fill="url(#purpleBlock)" stroke="#e4b7ff"/>
        <rect x="190" width="34" height="38" rx="5" fill="url(#pinkBlock)" stroke="#ffc4e7"/>
        <rect x="228" width="34" height="38" rx="5" fill="url(#cyanBlock)" stroke="#baffff"/>
        <rect x="266" width="34" height="38" rx="5" fill="url(#orangeBlock)" stroke="#fff0ae"/>
        <rect x="304" width="34" height="38" rx="5" fill="url(#pinkBlock)" stroke="#ffc4e7"/>
      </g>
