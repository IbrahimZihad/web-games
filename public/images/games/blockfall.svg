    <rect x="-22" y="-18" width="410" height="590" rx="22" fill="url(#panel)" stroke="#6d48a1" stroke-width="2"/>
    <rect width="366" height="546" rx="12" fill="#090b1b" stroke="#20e6e8" stroke-opacity="0.42" stroke-width="2"/>
    <rect width="366" height="546" rx="12" fill="url(#grid)"/>
    <path d="M0 0H366" stroke="#b687ff" stroke-width="7" filter="url(#glow)"/>

    <g stroke-width="2">
      <g transform="translate(38 378)">
